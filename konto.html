<div id="panel">

<h1>Panel klienta</h1>

<p id="user-email"></p>

<p>
✔ Konto aktywne
</p>

<button onclick="logout()">
Wyloguj się
</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyCVDfVFPZ0LVU1mwR9IQU21FtlQlJPwpwE",
authDomain: "strong-ants.firebaseapp.com",
projectId: "strong-ants",
storageBucket: "strong-ants.firebasestorage.app",
messagingSenderId: "673947229704",
appId: "1:673947229704:web:70e5d7b5b682469b013bbd",
measurementId: "G-S3QN3G4L41"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

window.register = function(){

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

createUserWithEmailAndPassword(auth,email,password)
.then(() => {
alert("Konto utworzone!");
})
.catch((error) => {
alert(error.message);
});

}

window.login = function(){

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

signInWithEmailAndPassword(auth,email,password)
.then(() => {
alert("Zalogowano!");
})
.catch((error) => {
alert(error.message);
});

}

window.logout = function(){

signOut(auth);

}

onAuthStateChanged(auth,(user)=>{

if(user){

document.getElementById("auth").style.display="none";
document.getElementById("panel").style.display="block";

document.getElementById("user-email").innerText =
"Zalogowano jako: " + user.email;

}else{

document.getElementById("auth").style.display="block";
