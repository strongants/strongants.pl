<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Strong Ants PRO CMS</title>

<style>

body{
margin:0;
background:#0d0d0d;
font-family:Arial;
color:white;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:260px;
height:100vh;
background:#111;
border-right:2px solid #ffd000;
padding:25px;
box-sizing:border-box;
overflow:auto;
}

.logo{
font-size:32px;
font-weight:bold;
color:#ffd000;
margin-bottom:40px;
line-height:1.2;
}

.menu-btn{
width:100%;
padding:16px;
margin-bottom:14px;
background:#161616;
border:none;
color:white;
font-size:18px;
border-radius:14px;
cursor:pointer;
text-align:left;
font-weight:bold;
transition:0.2s;
}

.menu-btn:hover{
background:#ffd000;
color:black;
}

.content{
margin-left:260px;
padding:40px;
}

.section{
display:none;
}

.box{
background:#161616;
border:1px solid #333;
border-radius:22px;
padding:25px;
margin-bottom:25px;
}

.title{
font-size:54px;
color:#ffd000;
margin-bottom:40px;
}

input,
textarea,
select{
width:100%;
padding:16px;
margin-top:10px;
margin-bottom:20px;
background:#0f0f0f;
border:1px solid #333;
border-radius:14px;
color:white;
font-size:16px;
box-sizing:border-box;
}

button{
padding:14px 24px;
background:#ffd000;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

.product{
background:#1a1a1a;
padding:20px;
border-radius:18px;
margin-bottom:20px;
border:1px solid #333;
}

.product img{
width:120px;
height:120px;
object-fit:cover;
border-radius:14px;
background:white;
padding:5px;
}

.badge{
display:inline-block;
padding:8px 14px;
border-radius:10px;
font-weight:bold;
margin-top:10px;
}

.green{
background:#003d1f;
color:#00ff99;
}

.red{
background:#4a0000;
color:#ff9e9e;
}

.order{
background:#161616;
padding:25px;
border-radius:20px;
margin-bottom:25px;
border:1px solid #333;
}

.order-status{
margin-top:15px;
padding:10px 15px;
border-radius:10px;
display:inline-block;
font-weight:bold;
}

.nowe{
background:#5c4200;
color:#ffd000;
}

.oplacone{
background:#003d1f;
color:#00ff99;
}

.wyslane{
background:#002b5c;
color:#7ab8ff;
}

.stats{
font-size:24px;
line-height:2;
}

@media(max-width:900px){

.sidebar{
position:relative;
width:100%;
height:auto;
border-right:none;
border-bottom:2px solid #ffd000;
}

.content{
margin-left:0;
padding:20px;
}

.title{
font-size:38px;
}

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
🐜 STRONG<br>
ANTS
</div>

<button class="menu-btn" onclick="openSection('dashboard')">
📊 Dashboard
</button>

<button class="menu-btn" onclick="openSection('products')">
🛒 Produkty
</button>

<button class="menu-btn" onclick="openSection('orders')">
📦 Zamówienia
</button>

<button class="menu-btn" onclick="openSection('shipping')">
🚚 Wysyłki
</button>

<button class="menu-btn" onclick="openSection('payments')">
💳 Płatności
</button>

<button class="menu-btn" onclick="openSection('settings')">
⚙ Ustawienia
</button>

</div>

<div class="content">

<div class="section" id="dashboard">

<h1 class="title">
📊 Dashboard
</h1>

<div class="box stats">

<div>
🛒 Zamówienia:
<span id="orders-count">0</span>
</div>

<div>
💰 Sprzedaż:
<span id="sales-total">0 zł</span>
</div>

<div>
📦 Produkty:
<span id="products-count">0</span>
</div>

</div>

</div>

<div class="section" id="products">

<h1 class="title">
🛒 Produkty
</h1>

<div class="box">

<h2>Dodaj produkt</h2>

<input id="product-name" placeholder="Nazwa produktu">

<textarea id="product-description"
placeholder="Opis produktu"></textarea>

<input id="product-price"
type="number"
placeholder="Cena">

<input id="product-stock"
type="number"
placeholder="Stan magazynowy">

<select id="product-category">

<option>Mrówki</option>
<option>Dekoracje</option>
<option>Akcesoria</option>
<option>Pokarmy</option>
<option>Formikaria</option>

</select>

<input id="product-image"
placeholder="Nazwa pliku zdjęcia">

<button onclick="addProduct()">
➕ Dodaj produkt
</button>

</div>

<div id="products-list"></div>

</div>

<div class="section" id="orders">

<h1 class="title">
📦 Zamówienia
</h1>

<div id="orders-list"></div>

</div>

<div class="section" id="shipping">

<h1 class="title">
🚚 Wysyłki
</h1>

<div class="box">

Panel wysyłek Strong Ants

</div>

</div>

<div class="section" id="payments">

<h1 class="title">
💳 Płatności
</h1>

<div class="box">

Stripe / PayU / Przelewy24

</div>

</div>

<div class="section" id="settings">

<h1 class="title">
⚙ Ustawienia
</h1>

<div class="box">

<input placeholder="Nazwa sklepu">

<input placeholder="Adres email">

<input placeholder="Telefon">

<button>
💾 Zapisz
</button>

</div>

</div>

</div>

<script>

/* LOGOWANIE */

let haslo =
prompt("Podaj hasło administratora");

if(haslo !== "strongantsMatiterraHf7"){

alert("Błędne hasło");

window.location.href = "index.html";

}

/* MENU */

function openSection(id){

document
.querySelectorAll('.section')
.forEach((section)=>{

section.style.display = "none";

});

document.getElementById(id)
.style.display = "block";

}

/* START */

openSection('dashboard');

/* PRODUKTY */

let domyslneProdukty = [

{
id:1,
nazwa:"Camponotus Nicobarensis",
opis:"Egzotyczny gatunek mrówek.",
cena:38.99,
stan:10,
kategoria:"Mrówki",
obraz:"camponotus-nicobarensis.jpg",
sprzedane:0
},

{
id:2,
nazwa:"Glina czerwona mielona",
opis:"Glina do formikariów.",
cena:3.49,
stan:20,
kategoria:"Dekoracje",
obraz:"glina-czerwona-mielona.jpg",
sprzedane:0
},

{
id:3,
nazwa:"Casuarina wybielana",
opis:"Naturalna dekoracja.",
cena:3.50,
stan:15,
kategoria:"Dekoracje",
obraz:"casuarina-wybielana.jpg",
sprzedane:0
},

{
id:4,
nazwa:"Probówki szklane",
opis:"Probówki do hodowli.",
cena:12.99,
stan:30,
kategoria:"Akcesoria",
obraz:"probowki-szklane.jpg",
sprzedane:0
},

{
id:5,
nazwa:"Karmidełko",
opis:"Karmidełko Strong Ants.",
cena:3.99,
stan:40,
kategoria:"Akcesoria",
obraz:"karmidelko-2.jpg",
sprzedane:0
}

];

let produkty =
JSON.parse(localStorage.getItem("produkty"));

if(!produkty){

produkty = domyslneProdukty;

localStorage.setItem(
"produkty",
JSON.stringify(produkty)
);

}

function saveProducts(){

localStorage.setItem(
"produkty",
JSON.stringify(produkty)
);

renderProducts();

updateDashboard();

}

function addProduct(){

let produkt = {

id:Date.now(),

nazwa:
document.getElementById("product-name").value,

opis:
document.getElementById("product-description").value,

cena:
Number(document.getElementById("product-price").value),

stan:
Number(document.getElementById("product-stock").value),

kategoria:
document.getElementById("product-category").value,

obraz:
document.getElementById("product-image").value,

sprzedane:0

};

produkty.push(produkt);

saveProducts();

}

function deleteProduct(index){

produkty.splice(index,1);

saveProducts();

}

function editProduct(index){

let nowaCena =
prompt("Nowa cena", produkty[index].cena);

if(nowaCena !== null){

produkty[index].cena =
Number(nowaCena);

}

let nowyStan =
prompt("Nowy stan", produkty[index].stan);

if(nowyStan !== null){

produkty[index].stan =
Number(nowyStan);

}

saveProducts();

}

function renderProducts(){

let kontener =
document.getElementById("products-list");

kontener.innerHTML = "";

produkty.forEach((produkt,index)=>{

let badge =
produkt.stan > 0

?

'<div class="badge green">Dostępny</div>'

:

'<div class="badge red">Brak w magazynie</div>';

kontener.innerHTML += `

<div class="product">

<img src="${produkt.obraz}"
onerror="this.src='logo (2).png'">

<h2>${produkt.nazwa}</h2>

<p>${produkt.opis}</p>

<p>💰 ${produkt.cena} zł</p>

<p>📦 Stan: ${produkt.stan}</p>

<p>📂 ${produkt.kategoria}</p>

${badge}

<br><br>

<button onclick="editProduct(${index})">
✏ Edytuj
</button>

<button onclick="deleteProduct(${index})">
🗑 Usuń
</button>

</div>

`;

});

}

/* ZAMÓWIENIA */

let zamowienia =
JSON.parse(localStorage.getItem("zamowienia")) || [];

function renderOrders(){

let kontener =
document.getElementById("orders-list");

kontener.innerHTML = "";

if(zamowienia.length === 0){

kontener.innerHTML =
'<div class="box">Brak zamówień.</div>';

return;

}

zamowienia.forEach((zamowienie)=>{

kontener.innerHTML += `

<div class="order">

<h2>
🧾 ${zamowienie.numer}
</h2>

<p>
👤 ${zamowienie.klient}
</p>

<p>
📧 ${zamowienie.email}
</p>

<p>
📅 ${zamowienie.data}
</p>

<div class="order-status nowe">
Nowe
</div>

</div>

`;

});

}

/* DASHBOARD */

function updateDashboard(){

document.getElementById(
"products-count"
).innerText = produkty.length;

document.getElementById(
"orders-count"
).innerText = zamowienia.length;

let suma = 0;

zamowienia.forEach((z)=>{

if(z.suma){

suma += Number(z.suma);

}

});

document.getElementById(
"sales-total"
).innerText =
suma.toFixed(2) + " zł";

}

renderProducts();
renderOrders();
updateDashboard();

</script>

</body>
</html>
