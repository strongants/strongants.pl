<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Panel administratora - Strong Ants</title>

<style>

body{
margin:0;
background:#0d0d0d;
font-family:Arial;
color:white;
}

.topbar{
background:black;
padding:20px;
border-bottom:2px solid #ffd000;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:34px;
font-weight:bold;
color:#ffd000;
}

.tabs{
display:flex;
gap:15px;
padding:30px;
flex-wrap:wrap;
}

.tab-btn{
padding:14px 26px;
background:#161616;
border:1px solid #333;
border-radius:12px;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

.tab-btn.active{
background:#ffd000;
color:black;
}

.tab-content{
display:none;
padding:0 30px 40px;
}

.tab-content.active{
display:block;
}

h1{
color:#ffd000;
font-size:42px;
margin-bottom:30px;
}

.box{
background:#161616;
border:1px solid #333;
border-radius:20px;
padding:25px;
margin-bottom:20px;
}

.box label{
display:block;
font-size:22px;
margin-bottom:15px;
color:#ffd000;
}

.box input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#0f0f0f;
color:white;
font-size:18px;
box-sizing:border-box;
margin-bottom:15px;
}

.box button{
padding:14px 24px;
background:#ffd000;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.status{
margin-top:12px;
color:#00e676;
font-size:17px;
}

.order{
background:#161616;
border:1px solid #333;
border-radius:20px;
padding:25px;
margin-bottom:25px;
}

.order-number{
font-size:30px;
font-weight:bold;
color:#ffd000;
margin-bottom:25px;
}

.client{
margin-bottom:12px;
font-size:18px;
color:#ddd;
}

.product{
display:flex;
align-items:center;
gap:20px;
padding:15px 0;
border-bottom:1px solid #333;
}

.product img{
width:80px;
height:80px;
object-fit:contain;
background:white;
border-radius:12px;
padding:6px;
}

.product-info{
flex:1;
}

.product-name{
font-size:20px;
font-weight:bold;
color:#ffd000;
margin-bottom:8px;
}

.product-details{
font-size:17px;
color:#ddd;
line-height:1.7;
}

.total{
margin-top:25px;
font-size:32px;
font-weight:bold;
color:#00e676;
}

.empty{
font-size:24px;
color:#999;
}

.delete-btn{
margin-top:25px;
padding:14px 22px;
background:red;
border:none;
border-radius:12px;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

@media(max-width:768px){

.tabs{
padding:20px;
}

.tab-content{
padding:0 20px 30px;
}

.product{
flex-direction:column;
align-items:flex-start;
}

}

</style>

</head>

<body>

<div class="topbar">

<div class="logo">
🐜 STRONG ANTS ADMIN
</div>

</div>

<div class="tabs">

<button class="tab-btn active"
onclick="openTab('magazyn',this)">

📦 Stany magazynowe

</button>

<button class="tab-btn"
onclick="openTab('zamowienia',this)">

🧾 Zamówienia klientów

</button>

</div>

<!-- STANY MAGAZYNOWE -->

<div class="tab-content active"
id="magazyn">

<h1>
📦 Stany magazynowe
</h1>

<div id="panel"></div>

</div>

<!-- ZAMÓWIENIA -->

<div class="tab-content"
id="zamowienia">

<h1>
🧾 Zamówienia klientów
</h1>

<div id="orders"></div>

</div>

<script>

function openTab(id,button){

document.querySelectorAll(".tab-content")
.forEach(tab=>{
tab.classList.remove("active");
});

document.querySelectorAll(".tab-btn")
.forEach(btn=>{
btn.classList.remove("active");
});

document.getElementById(id)
.classList.add("active");

button.classList.add("active");

}

/* STANY MAGAZYNOWE */

const STANY = {

"Camponotus Nicobarensis":10,
"Poidełko do hodowli mrówek":15,
"Probówki szklane":20,
"Mata grzewcza":7,
"Pipety":30

};

if(localStorage.getItem("stanyMagazynowe")){

const zapisane =
JSON.parse(
localStorage.getItem("stanyMagazynowe")
);

Object.assign(STANY,zapisane);

}

const panel =
document.getElementById("panel");

Object.keys(STANY).forEach((produkt)=>{

panel.innerHTML += `

<div class="box">

<label>
${produkt}
</label>

<input
id="${produkt}"
type="number"
value="${STANY[produkt]}"
min="0">

<button onclick="zapiszStan('${produkt}')">

Zapisz stan

</button>

<div class="status"
id="status-${produkt}">
</div>

</div>

`;

});

function zapiszStan(produkt){

let wartosc = parseInt(
document.getElementById(produkt).value
);

if(isNaN(wartosc)){
wartosc = 0;
}

STANY[produkt] = wartosc;

localStorage.setItem(
"stanyMagazynowe",
JSON.stringify(STANY)
);

document.getElementById(
"status-" + produkt
).innerHTML = "✔ Zapisano";

}

/* ZAMÓWIENIA */

let zamowienia =
JSON.parse(localStorage.getItem("zamowienia")) || [];

let kontener =
document.getElementById("orders");

if(zamowienia.length === 0){

kontener.innerHTML =
'<div class="empty">Brak zamówień.</div>';

}

zamowienia.reverse().forEach((zamowienie,index)=>{

let suma = 0;

let produktyHTML = "";

zamowienie.produkty.forEach((produkt)=>{

let ilosc = produkt.ilosc || 1;

let cena =
Number(produkt.cena) * ilosc;

suma += cena;

produktyHTML += `

<div class="product">

<img src="${produkt.obraz}"
onerror="this.src='logo (2).png'">

<div class="product-info">

<div class="product-name">
${produkt.nazwa}
</div>

<div class="product-details">

📦 Ilość: ${ilosc}<br>

💰 Cena:
${cena.toFixed(2)} zł

</div>

</div>

</div>

`;

});

kontener.innerHTML += `

<div class="order">

<div class="order-number">
🧾 ${zamowienie.numer}
</div>

<div class="client">
👤 ${zamowienie.klient}
</div>

<div class="client">
📧 ${zamowienie.email}
</div>

<div class="client">
📞 ${zamowienie.telefon}
</div>

<div class="client">
🏠 ${zamowienie.adres}
</div>

<div class="client">
📅 ${zamowienie.data}
</div>

<br>

${produktyHTML}

<div class="total">
💳 Razem:
${suma.toFixed(2)} zł
</div>

<button class="delete-btn"
onclick="usunZamowienie(${zamowienia.length - 1 - index})">

🗑 Usuń zamówienie

</button>

</div>

`;

});

function usunZamowienie(index){

let potwierdzenie =
confirm("Czy na pewno usunąć zamówienie?");

if(!potwierdzenie){
return;
}

let zamowienia =
JSON.parse(localStorage.getItem("zamowienia")) || [];

zamowienia.splice(index,1);

localStorage.setItem(
"zamowienia",
JSON.stringify(zamowienia)
);

location.reload();

}

</script>

</body>
</html>
