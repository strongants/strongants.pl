<!DOCTYPE html>

<head>

content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
background:#0d0d0d;

.topbar{
background:black;
border-bottom:2px solid #ffd000;

}

h1{

}

.product{

border:1px solid #333;
border-radius:20px;
padding:25px;

}

.product-title{
font-size:28px;
color:#ffd000;
margin-bottom:20px;
font-weight:bold;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.input-group{
display:flex;
flex-direction:column;
}

.input-group label{
margin-bottom:10px;

}

.input-group input,
.input-group select{

font-size:16px;
}

.save-btn{

padding:15px 24px;
background:#ffd000;

.status{

}

<body>

<script>

if(haslo !== "StrongAntsMaterraHF7"){

alert("Błędne hasło");

window.location.href = "index.html";

}

</script>

<div class="topbar">

<div class="logo">
🐜 STRONG ANTS PRO ADMIN
</div>

<button class="logout"
onclick="wyloguj()">

Wyloguj

</button>

</div>

<div class="tabs">

<button class="tab-btn active"
onclick="openTab('mrowki',this)">
🐜 Mrówki
</button>

<button class="tab-btn"
onclick="openTab('dekoracje',this)">
🏜 Dekoracje
</button>

<button class="tab-btn"
onclick="openTab('akcesoria',this)">
🧪 Akcesoria
</button>

<button class="tab-btn"
onclick="openTab('zamowienia',this)">
📦 Zamówienia
</button>

</div>

<!-- MRÓWKI -->

<div class="tab active" id="mrowki">

<h1>
🐜 Zarządzanie mrówkami
</h1>

<div id="mrowkiPanel"></div>

</div>

<!-- DEKORACJE -->

<div class="tab" id="dekoracje">

<h1>
🏜 Zarządzanie dekoracjami
</h1>

<div id="dekoracjePanel"></div>

</div>

<!-- AKCESORIA -->

<div class="tab" id="akcesoria">

<h1>
🧪 Zarządzanie akcesoriami
</h1>

<div id="akcesoriaPanel"></div>

</div>

<!-- ZAMÓWIENIA -->

<div class="tab" id="zamowienia">

<h1>
📦 Zamówienia klientów
</h1>

<div id="orders"></div>

</div>

<script>

function openTab(id,button){

document.querySelectorAll(".tab")
.forEach(tab=>{
tab.classList.remove("active");
});

document.querySelectorAll(".tab-btn")
.forEach(btn=>{
btn.classList.remove("active");
});

document.getElementById(id)
.classList.add("active");

button.classList.add("active");

}

function wyloguj(){

location.reload();

}

/* BAZA PRODUKTÓW */

let produkty = {

mrowki:[

{
id:"camponotus-nicobarensis",
nazwa:"Camponotus Nicobarensis",
cena:"38.99",
stan:10,
status:"dostepny",
obraz:"camponotus-nicobarensis.jpg"
}

],

dekoracje:[

{
id:"piasek-czarny",
nazwa:"Piasek czarny",
cena:"3.99",
stan:25,
status:"dostepny",
obraz:"piasek-czarny.jpg"
},

{
id:"piasek-kwarcowy",
nazwa:"Piasek kwarcowy biały",
cena:"3.99",
stan:18,
status:"dostepny",
obraz:"piasek-kwarcowy-bialy.jpg"
}

],

akcesoria:[

{
id:"poidelko",
nazwa:"Poidełko do hodowli mrówek",
cena:"3.99",
stan:20,
status:"dostepny",
obraz:"poidelko-do-hodowli-mrowek.jpg"
}

]

};

if(localStorage.getItem("produktyPRO")){

produkty =
JSON.parse(
localStorage.getItem("produktyPRO")
);

}

function renderProdukty(kategoria,idPanelu){

const panel =
document.getElementById(idPanelu);

panel.innerHTML = "";

produkty[kategoria].forEach((produkt,index)=>{

panel.innerHTML += `

<div class="product">

<div class="product-title">
${produkt.nazwa}
</div>

<div class="grid">

<div class="input-group">

<label>
Cena
</label>

<input type="number"
id="${kategoria}-cena-${index}"
value="${produkt.cena}">

</div>

<div class="input-group">

<label>
Stan magazynowy
</label>

<input type="number"
id="${kategoria}-stan-${index}"
value="${produkt.stan}">

</div>

<div class="input-group">

<label>
Zdjęcie
</label>

<input type="text"
id="${kategoria}-obraz-${index}"
value="${produkt.obraz}">

</div>

<div class="input-group">

<label>
Status
</label>

<select id="${kategoria}-status-${index}">

<option value="dostepny"
${produkt.status === "dostepny" ? "selected" : ""}>

Dostępny

</option>

<option value="brak"
${produkt.status === "brak" ? "selected" : ""}>

Brak w magazynie

</option>

</select>

</div>

</div>

<button class="save-btn"
onclick="zapiszProdukt('${kategoria}',${index})">

💾 Zapisz zmiany

</button>

<div class="status"
id="${kategoria}-statusinfo-${index}">
</div>

</div>

`;

});

}

function zapiszProdukt(kategoria,index){

produkty[kategoria][index].cena =
document.getElementById(
`${kategoria}-cena-${index}`
).value;

produkty[kategoria][index].stan =
document.getElementById(
`${kategoria}-stan-${index}`
).value;

produkty[kategoria][index].obraz =
document.getElementById(
`${kategoria}-obraz-${index}`
).value;

produkty[kategoria][index].status =
document.getElementById(
`${kategoria}-status-${index}`
).value;

if(produkty[kategoria][index].stan <= 0){

produkty[kategoria][index].status =
"brak";

}

localStorage.setItem(
"produktyPRO",
JSON.stringify(produkty)
);

document.getElementById(
`${kategoria}-statusinfo-${index}`
).innerHTML =
"✔ Zapisano";

}

/* RENDER */

renderProdukty(
"mrowki",
"mrowkiPanel"
);

renderProdukty(
"dekoracje",
"dekoracjePanel"
);

renderProdukty(
"akcesoria",
"akcesoriaPanel"
);

/* ZAMÓWIENIA */

let zamowienia =
JSON.parse(localStorage.getItem("zamowienia")) || [];

let kontener =
document.getElementById("orders");

if(zamowienia.length === 0){

kontener.innerHTML =
'<div class="empty">Brak zamówień.</div>';

}

zamowienia.reverse().forEach((zamowienie,index)=>{

let suma = 0;

let produktyHTML = "";

zamowienie.produkty.forEach((produkt)=>{

let ilosc = produkt.ilosc || 1;

let cena =
Number(produkt.cena) * ilosc;

suma += cena;

produktyHTML += `

<div class="order-product">

<img src="${produkt.obraz}"
onerror="this.src='logo (2).png'">

<div>

<div style="font-size:20px;
font-weight:bold;
color:#ffd000;">

${produkt.nazwa}

</div>

<div style="margin-top:8px;">

📦 Ilość:
${ilosc}

<br><br>

💰
${cena.toFixed(2)} zł

</div>

</div>

</div>

`;

});

kontener.innerHTML += `

<div class="order">

<div class="order-number">

🧾 ${zamowienie.numer}

</div>

<div class="client">
👤 ${zamowienie.klient}
</div>

<div class="client">
📧 ${zamowienie.email}
</div>

<div class="client">
📞 ${zamowienie.telefon}
</div>

<div class="client">
🏠 ${zamowienie.adres}
</div>

<div class="client">
📅 ${zamowienie.data}
</div>

${produktyHTML}

<div class="total">

💳 Razem:
${suma.toFixed(2)} zł

</div>

<button class="delete-btn"
onclick="usunZamowienie(${zamowienia.length - 1 - index})">

🗑 Usuń zamówienie

</button>

</div>

`;

});

function usunZamowienie(index){

let potwierdzenie =
confirm("Usunąć zamówienie?");

if(!potwierdzenie){
return;
}

let zamowienia =
JSON.parse(localStorage.getItem("zamowienia")) || [];

zamowienia.splice(index,1);

localStorage.setItem(
"zamowienia",
JSON.stringify(zamowienia)
);

location.reload();

}

</script>

</body>
</html>
