<title>Strong Ants PRO CMS</title>

<style>

body{
margin:0;
background:#0d0d0d;
font-family:Arial;
color:white;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:280px;
height:100vh;
background:#111;
border-right:2px solid #ffd000;
padding:25px;
box-sizing:border-box;
overflow:auto;
}

.logo{
font-size:34px;
font-weight:bold;
color:#ffd000;
margin-bottom:40px;
line-height:1.3;
}

.menu-btn{
width:100%;
padding:16px;
margin-bottom:15px;
background:#161616;
border:none;
color:white;
font-size:18px;
font-weight:bold;
border-radius:14px;
cursor:pointer;
text-align:left;
transition:0.2s;
}

.menu-btn:hover{
background:#ffd000;
color:black;
}

.content{
margin-left:280px;
padding:40px;
}

.section{
display:none;
}

.title{
font-size:52px;
color:#ffd000;
margin-bottom:40px;
}

.box{
background:#161616;
border:1px solid #333;
border-radius:22px;
padding:25px;
margin-bottom:30px;
}

input,
textarea,
select{
width:100%;
padding:16px;
margin-top:10px;
margin-bottom:20px;
background:#0f0f0f;
border:1px solid #333;
border-radius:14px;
color:white;
font-size:16px;
box-sizing:border-box;
}

button{
padding:14px 24px;
background:#ffd000;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:scale(1.03);
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:30px;
}

.stat-box{
background:#161616;
padding:30px;
border-radius:20px;
border:1px solid #333;
}

.stat-box h2{
font-size:42px;
margin:0;
color:#ffd000;
}

.stat-box p{
color:#999;
font-size:18px;
}

.category-title{
font-size:34px;
color:#ffd000;
margin:45px 0 25px;
border-bottom:2px solid #333;
padding-bottom:10px;
}

.product{
background:#161616;
padding:25px;
border-radius:20px;
border:1px solid #333;
margin-bottom:25px;
}

.product img{
width:130px;
height:130px;
object-fit:contain;
background:white;
border-radius:14px;
padding:8px;
margin-bottom:20px;
}

.product h2{
color:#ffd000;
}

.badge{
display:inline-block;
padding:10px 16px;
border-radius:10px;
font-weight:bold;
margin-top:15px;
}

.green{
background:#003d1f;
color:#00ff99;
}

.red{
background:#4a0000;
color:#ff9e9e;
}

.order{
background:#161616;
padding:25px;
border-radius:20px;
border:1px solid #333;
margin-bottom:25px;
}

.order-product{
padding:12px 0;
border-bottom:1px solid #333;
}

@media(max-width:900px){

.sidebar{
position:relative;
width:100%;
height:auto;
border-right:none;
border-bottom:2px solid #ffd000;
}

.content{
margin-left:0;
padding:20px;
}

.title{
font-size:38px;
}

}

</style>

<div class="section"

<div id="orders-list"></div>

</div>

<!-- USTAWIENIA -->

<div class="section"
id="settings">

<h1 class="title">

⚙ Ustawienia

</h1>

<div class="box">

<input placeholder="Nazwa sklepu">

<input placeholder="Adres email">

<input placeholder="Telefon">

<button>
💾 Zapisz
</button>

</div>

</div>

</div>

produkty = domyslneProdukty;

localStorage.setItem(
"produkty",
JSON.stringify(produkty)
);

}

function saveProducts(){

localStorage.setItem(
"produkty",
JSON.stringify(produkty)
);

renderProducts();
updateDashboard();

}

function addProduct(){

let produkt = {

id:Date.now(),

nazwa:
document.getElementById("product-name").value,

opis:
document.getElementById("product-description").value,

cena:
Number(document.getElementById("product-price").value),

stan:
Number(document.getElementById("product-stock").value),

kategoria:
document.getElementById("product-category").value,

obraz:
document.getElementById("product-image").value,

sprzedane:0

};

produkty.push(produkt);

saveProducts();

}

function deleteProduct(index){

produkty.splice(index,1);

saveProducts();

}

function editProduct(index){

let nowaCena =
prompt("Nowa cena", produkty[index].cena);

if(nowaCena !== null){

produkty[index].cena =
Number(nowaCena);

}

let nowyStan =
prompt("Nowy stan magazynowy", produkty[index].stan);

if(nowyStan !== null){

produkty[index].stan =
Number(nowyStan);

}

saveProducts();

}

function renderProducts(){

let kontener =
document.getElementById("products-list");

kontener.innerHTML = "";

let categories = [
"Mrówki",
"Dekoracje",
"Akcesoria",
"Pokarmy"
];

categories.forEach((cat)=>{

kontener.innerHTML += `

<div class="category-title">

${cat}

</div>

`;

produkty
.filter(p => p.kategoria === cat)
.forEach((produkt,index)=>{

let badge =
produkt.stan > 0

?

'<div class="badge green">Dostępny</div>'

:

'<div class="badge red">Brak w magazynie</div>';

kontener.innerHTML += `

<div class="product">

<img src="${produkt.obraz}"
onerror="this.src='logo (2).png'">

<h2>
${produkt.nazwa}
</h2>

<p>
${produkt.opis}
</p>

<p>
💰 ${produkt.cena} zł
</p>

<p>
📦 Stan:
${produkt.stan}
</p>

<p>
🔥 Sprzedane:
${produkt.sprzedane}
</p>

${badge}

<br><br>

<button onclick="editProduct(${index})">

✏ Edytuj

</button>

<button onclick="deleteProduct(${index})">

🗑 Usuń

</button>

</div>

`;

});

});

}

/* ZAMÓWIENIA */

let zamowienia =
JSON.parse(localStorage.getItem("zamowienia")) || [];

function renderOrders(){

let kontener =
document.getElementById("orders-list");

kontener.innerHTML = "";

if(zamowienia.length === 0){

kontener.innerHTML =
'<div class="box">Brak zamówień.</div>';

return;

}

zamowienia.forEach((zamowienie)=>{

let produktyHTML = "";

if(zamowienie.produkty){

zamowienie.produkty.forEach((produkt)=>{

produktyHTML += `

<div class="order-product">

${produkt.nazwa}
x${produkt.ilosc || 1}

</div>

`;

});

}

kontener.innerHTML += `

<div class="order">

<h2>
🧾 ${zamowienie.numer}
</h2>

<p>
👤 ${zamowienie.klient}
</p>

<p>
📧 ${zamowienie.email}
</p>

<p>
📅 ${zamowienie.data}
</p>

${produktyHTML}

</div>

`;

});

}

/* DASHBOARD */

function updateDashboard(){

document.getElementById(
"products-count"
).innerText = produkty.length;

document.getElementById(
"orders-count"
).innerText = zamowienia.length;

let suma = 0;

zamowienia.forEach((z)=>{

if(z.suma){

suma += Number(z.suma);

}

});

document.getElementById(
"sales-total"
).innerText =
suma.toFixed(2) + " zł";

}

renderProducts();
renderOrders();
updateDashboard();
