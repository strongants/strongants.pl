<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Strong Ants PRO CMS</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
background:#0d0d0d;
font-family:Arial;
color:white;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:260px;
height:100vh;
background:#111;
border-right:2px solid #ffd000;
padding:25px;
box-sizing:border-box;
overflow:auto;
}

.logo{
font-size:32px;
font-weight:bold;
color:#ffd000;
margin-bottom:40px;
}

.menu-btn{
width:100%;
padding:15px;
margin-bottom:15px;
background:#161616;
border:none;
color:white;
font-size:18px;
border-radius:12px;
cursor:pointer;
text-align:left;
}

.menu-btn:hover{
background:#ffd000;
color:black;
}

.content{
margin-left:280px;
padding:40px;
}

.section{
display:none;
}

.section.active{
display:block;
}

.box{
background:#161616;
border:1px solid #333;
border-radius:20px;
padding:25px;
margin-bottom:25px;
}

.title{
font-size:42px;
color:#ffd000;
margin-bottom:30px;
}

input,
textarea,
select{
width:100%;
padding:15px;
margin-top:10px;
margin-bottom:20px;
background:#0f0f0f;
border:1px solid #333;
border-radius:12px;
color:white;
font-size:16px;
box-sizing:border-box;
}

button{
padding:14px 24px;
background:#ffd000;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

.product{
background:#1a1a1a;
padding:20px;
border-radius:16px;
margin-bottom:20px;
border:1px solid #333;
}

.product img{
width:120px;
height:120px;
object-fit:cover;
border-radius:14px;
background:white;
}

.badge{
display:inline-block;
padding:8px 14px;
border-radius:10px;
font-weight:bold;
margin-top:10px;
}

.green{
background:#003d1f;
color:#00ff99;
}

.red{
background:#4a0000;
color:#ff9e9e;
}

.order{
background:#161616;
padding:25px;
border-radius:20px;
margin-bottom:25px;
border:1px solid #333;
}

.order-status{
margin-top:15px;
padding:10px 15px;
border-radius:10px;
display:inline-block;
font-weight:bold;
}

.nowe{
background:#5c4200;
color:#ffd000;
}

.oplacone{
background:#003d1f;
color:#00ff99;
}

.wyslane{
background:#002b5c;
color:#7ab8ff;
}

</style>
</head>
<body>

<div class="sidebar">

<div class="logo">
🐜 STRONG ANTS
</div>

<button class="menu-btn" onclick="openSection('dashboard')">
📊 Dashboard
</button>

<button class="menu-btn" onclick="openSection('products')">
🛒 Produkty
</button>

<button class="menu-btn" onclick="openSection('orders')">
📦 Zamówienia
</button>

<button class="menu-btn" onclick="openSection('shipping')">
🚚 Wysyłki
</button>

<button class="menu-btn" onclick="openSection('payments')">
💳 Płatności
</button>

<button class="menu-btn" onclick="openSection('settings')">
⚙ Ustawienia
</button>

</div>

<div class="content">

<!-- DASHBOARD -->

<div class="section active" id="dashboard">

<h1 class="title">
📊 Dashboard
</h1>

<div class="box">

<h2>
Statystyki sklepu
</h2>

<p>
🛒 Zamówienia: <span id="orders-count">0</span>
</p>

<p>
💰 Sprzedaż: <span id="sales-total">0 zł</span>
</p>

<p>
📦 Produkty: <span id="products-count">0</span>
</p>

</div>

</div>

<!-- PRODUKTY -->

<div class="section" id="products">

<h1 class="title">
🛒 Zarządzanie produktami
</h1>

<div class="box">

<h2>
Dodaj nowy produkt
</h2>

<input id="product-name" placeholder="Nazwa produktu">

<textarea id="product-description"
placeholder="Opis produktu"></textarea>

<input id="product-price"
type="number"
placeholder="Cena">

<input id="product-stock"
type="number"
placeholder="Stan magazynowy">

<select id="product-category">
<option>Mrówki</option>
<option>Dekoracje</option>
<option>Akcesoria</option>
<option>Pokarmy</option>
<option>Formikaria</option>
</select>

<input id="product-image"
placeholder="Nazwa zdjęcia">

<button onclick="addProduct()">
➕ Dodaj produkt
</button>

</div>

<div id="products-list"></div>

</div>

<!-- ZAMÓWIENIA -->

<div class="section" id="orders">

<h1 class="title">
📦 Zamówienia klientów
</h1>

<div id="orders-list"></div>

</div>

<!-- WYSYŁKI -->

<div class="section" id="shipping">

<h1 class="title">
🚚 Panel wysyłek
</h1>

<div class="box">

<h2>
Integracja InPost
</h2>

<p>
Tutaj podłączysz API InPost.
</p>

</div>

</div>

<!-- PŁATNOŚCI -->

<div class="section" id="payments">

<h1 class="title">
💳 Płatności
</h1>

<div class="box">

<h2>
Stripe
</h2>

<input placeholder="Stripe Publishable Key">

<input placeholder="Stripe Secret Key">

<button>
Połącz Stripe
</button>

</div>

<div class="box">

<h2>
PayU
</h2>

<input placeholder="Client ID">

<input placeholder="Client Secret">

<button>
Połącz PayU
</button>

</div>

<div class="box">

<h2>
Przelewy24
</h2>

<input placeholder="Merchant ID">

<input placeholder="CRC Key">

<button>
Połącz Przelewy24
</button>

</div>

</div>

<!-- USTAWIENIA -->

<div class="section" id="settings">

<h1 class="title">
⚙ Ustawienia sklepu
</h1>

<div class="box">

<input placeholder="Nazwa sklepu">

<input placeholder="Adres e-mail sklepu">

<input placeholder="Telefon">

<button>
💾 Zapisz ustawienia
</button>

</div>

</div>

</div>

<script>

function openSection(id){

let sections =
document.querySelectorAll('.section');

sections.forEach((section)=>{
section.classList.remove('active');
});

document.getElementById(id)
.classList.add('active');

}

/* BAZA */

let produkty =
JSON.parse(localStorage.getItem('produkty')) || [];

function saveProducts(){

localStorage.setItem(
'produkty',
JSON.stringify(produkty)
);

renderProducts();

}

function addProduct(){

let produkt = {

id:Date.now(),

nazwa:
document.getElementById('product-name').value,

opis:
document.getElementById('product-description').value,

cena:
document.getElementById('product-price').value,

stan:
document.getElementById('product-stock').value,

kategoria:
document.getElementById('product-category').value,

obraz:
document.getElementById('product-image').value,

sprzedane:0

};

produkty.push(produkt);

saveProducts();

}

function renderProducts(){

let kontener =
document.getElementById('products-list');

kontener.innerHTML = '';

produkty.forEach((produkt,index)=>{

let badge = produkt.stan > 0
?
'<div class="badge green">Dostępny</div>'
:
'<div class="badge red">Brak w magazynie</div>';

kontener.innerHTML += `

<div class="product">

<img src="${produkt.obraz}"
onerror="this.src='logo (2).png'">

<h2>
${produkt.nazwa}
</h2>

<p>
${produkt.opis}
</p>

<p>
💰 ${produkt.cena} zł
</p>

<p>
📦 Stan: ${produkt.stan}
</p>

<p>
🔥 Sprzedane: ${produkt.sprzedane}
</p>

${badge}

<br><br>

<button onclick="editProduct(${index})">
✏ Edytuj
</button>

<button onclick="deleteProduct(${index})">
🗑 Usuń
</button>

</div>

`;

});

}

function deleteProduct(index){

produkty.splice(index,1);

saveProducts();

}

function editProduct(index){

let nowaCena = prompt(
'Nowa cena',
produkty[index].cena
);

produkty[index].cena = nowaCena;

saveProducts();

}

/* ZAMÓWIENIA */

let zamowienia =
JSON.parse(localStorage.getItem('zamowienia')) || [];

function renderOrders(){

let kontener =
document.getElementById('orders-list');

kontener.innerHTML = '';

zamowienia.forEach((zamowienie)=>{

kontener.innerHTML += `

<div class="order">

<h2>
🧾 ${zamowienie.numer}
</h2>

<p>
👤 ${zamowienie.klient}
</p>

<p>
📧 ${zamowienie.email}
</p>

<div class="order-status nowe">
Nowe
</div>

</div>

`;

});

}

renderProducts();
renderOrders();

</script>

</body>
</html>
