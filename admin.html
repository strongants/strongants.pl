<script>

function openSection(id){

let sections =
document.querySelectorAll('.section');

sections.forEach((section)=>{

section.classList.remove('active');

});

document.getElementById(id)
.classList.add('active');

}

/* BAZA PRODUKTÓW */

let produkty =
JSON.parse(localStorage.getItem('produkty')) || [];

function saveProducts(){

localStorage.setItem(
'produkty',
JSON.stringify(produkty)
);

renderProducts();

updateDashboard();

}

function addProduct(){

let produkt = {

id:Date.now(),

nazwa:
document.getElementById('product-name').value,

opis:
document.getElementById('product-description').value,

cena:
document.getElementById('product-price').value,

stan:
document.getElementById('product-stock').value,

kategoria:
document.getElementById('product-category').value,

obraz:
document.getElementById('product-image').value,

sprzedane:0

};

produkty.push(produkt);

saveProducts();

}

function openCategory(category){

renderProducts(category);

}

function renderProducts(category = 'all'){

let kontener =
document.getElementById('products-list');

kontener.innerHTML = '';

let categories = [

'Mrówki',
'Dekoracje',
'Akcesoria',
'Pokarmy',
'Formikaria'

];

categories.forEach((cat)=>{

let filteredProducts =
produkty.filter((produkt)=>{

if(category === 'all'){

return produkt.kategoria === cat;

}

return produkt.kategoria === category;

});

if(filteredProducts.length > 0){

kontener.innerHTML += `

<div class="category-title">

${cat}

</div>

`;

filteredProducts.forEach((produkt,index)=>{

let badge = produkt.stan > 0

?

'<div class="badge green">Dostępny</div>'

:

'<div class="badge red">Brak w magazynie</div>';

kontener.innerHTML += `

<div class="product">

<img src="${produkt.obraz}"
onerror="this.src='logo (2).png'">

<h2>

${produkt.nazwa}

</h2>

<p>

${produkt.opis}

</p>

<p>

💰 ${produkt.cena} zł

</p>

<p>

📦 Stan:
${produkt.stan}

</p>

<p>

🔥 Sprzedane:
${produkt.sprzedane || 0}

</p>

${badge}

<br><br>

<button onclick="editProduct(${index})">

✏ Edytuj cenę

</button>

<button onclick="editStock(${index})">

📦 Edytuj stan

</button>

<button onclick="deleteProduct(${index})">

🗑 Usuń

</button>

</div>

`;

});

}

});

}

function editProduct(index){

let nowaCena = prompt(
'Nowa cena:',
produkty[index].cena
);

produkty[index].cena = nowaCena;

saveProducts();

}

function editStock(index){

let nowyStan = prompt(
'Nowy stan magazynowy:',
produkty[index].stan
);

produkty[index].stan = nowyStan;

saveProducts();

}

function deleteProduct(index){

produkty.splice(index,1);

saveProducts();

}

/* ZAMÓWIENIA */

let zamowienia =
JSON.parse(localStorage.getItem('zamowienia')) || [];

function renderOrders(){

let kontener =
document.getElementById('orders-list');

kontener.innerHTML = '';

zamowienia.reverse().forEach((zamowienie)=>{

let produktyHTML = '';

let suma = 0;

zamowienie.produkty.forEach((produkt)=>{

let ilosc = produkt.ilosc || 1;

let cena =
Number(produkt.cena) * ilosc;

suma += cena;

produktyHTML += `

<div class="order-product">

<img src="${produkt.obraz}"
onerror="this.src='logo (2).png'">

<div>

<b>
${produkt.nazwa}
</b>

<br>

Ilość:
${ilosc}

<br>

${cena.toFixed(2)} zł

</div>

</div>

`;

});

kontener.innerHTML += `

<div class="order">

<h2>

🧾 ${zamowienie.numer}

</h2>

<p>
👤 ${zamowienie.klient}
</p>

<p>
📧 ${zamowienie.email}
</p>

<p>
📞 ${zamowienie.telefon}
</p>

<p>
🏠 ${zamowienie.adres}
</p>

<p>
📅 ${zamowienie.data}
</p>

<br>

${produktyHTML}

<div class="status nowe">

Nowe zamówienie

</div>

<h2 style="color:#00ff99;">

${suma.toFixed(2)} zł

</h2>

</div>

`;

});

}

/* DASHBOARD */

function updateDashboard(){

document.getElementById(
'dashboard-products'
).innerText = produkty.length;

document.getElementById(
'dashboard-orders'
).innerText = zamowienia.length;

let sales = 0;

zamowienia.forEach((zam)=>{

zam.produkty.forEach((produkt)=>{

sales +=
Number(produkt.cena) *
(produkt.ilosc || 1);

});

});

document.getElementById(
'dashboard-sales'
).innerText =
sales.toFixed(2) + ' zł';

}

renderProducts();

renderOrders();

updateDashboard();

</script>
