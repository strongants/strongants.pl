<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produkty - Strong Ants</title>

<style>

body{
margin:0;
background:#0d0d0d;
font-family:Arial;
color:white;
}

header{

padding:20px;
border-bottom:2px solid #ffd000;
}

.logo{
font-size:32px;
font-weight:bold;

}

.section{
padding:60px 10%;
}

.title{
font-size:42px;
color:#ffd000;
margin-bottom:40px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));

.card{

border:1px solid #333;

.card h3{

}

.button{
display:inline-block;
margin-top:20px;
padding:14px 28px;

<body>

<header>
<div class="logo">STRONG ANTS</div>
</header>

<section class="section">

<div class="products">

<div class="card">
  <img src="mrowki-jpg.png" alt="Mrówki">
<h3>🐜 Mrówki</h3>

<p>
Kolonie mrówek dla początkujących i zaawansowanych hodowców.
</p>

<a class="button" href="mrowki.html">
Zobacz mrówki
</a>

</div>

<div class="card">
  <img src="akcesoria.jpg" alt="Akcesoria">
<h3>🧰 Akcesoria</h3>

<p>
Formikaria, poidła i akcesoria do hodowli mrówek.
</p>

<a class="button" href="akcesoria.html">
Zobacz akcesoria
</a>

</div>

<div class="card">
  <img src="dekoracje.jpg" alt="Dekoracje">

<h3>🏜️ Dekoracje</h3>

<p>
Piaski, kamienie i dekoracje do aren formikarium.
</p>

<a class="button" href="dekoracje.html">
Zobacz dekoracje
</a>

</div>

</div>

</section>

</html>
