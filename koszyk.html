<script>

function wyswietlKoszyk(){

let koszyk =
JSON.parse(localStorage.getItem("koszyk")) || [];

let stany =
JSON.parse(localStorage.getItem("produkty")) || [];

let kontener =
document.getElementById("koszyk");

let suma = 0;

let blokada = false;

document.getElementById("cart-title")
.innerText =
"🛒 Twój koszyk (" + koszyk.length + ")";

if(koszyk.length === 0){

kontener.innerHTML = `

<div class="empty">

Koszyk jest pusty.

</div>

`;

document.querySelector(".total-box")
.style.display = "none";

document.getElementById("checkout-btn")
.classList.add("checkout-disabled");

return;

}

kontener.innerHTML = "";

koszyk.forEach((produkt,index)=>{

if(!produkt.ilosc){

produkt.ilosc = 1;

}

let stanProduktu = 999;

stany.forEach((p)=>{

if(p.nazwa === produkt.nazwa){

stanProduktu = p.stan;

}

});

let cenaProduktu =
Number(produkt.cena) *
produkt.ilosc;

suma += cenaProduktu;

let stockHTML = '';

if(stanProduktu <= 0){

blokada = true;

stockHTML = `

<div class="stock-badge stock-bad">

❌ Produkt niedostępny

</div>

`;

}else{

stockHTML = `

<div class="stock-badge stock-ok">

✔ Produkt dostępny

</div>

`;

}

kontener.innerHTML += `

<div class="product">

<img src="${produkt.obraz}"
alt="${produkt.nazwa}"
onerror="this.src='logo (2).png'">

<div class="product-info">

<h3>

${produkt.nazwa}

</h3>

<div class="product-summary">

Cena za sztukę:
${Number(produkt.cena).toFixed(2)} zł

<br>

Ilość:
${produkt.ilosc}

<br>

Łącznie:
${cenaProduktu.toFixed(2)} zł

</div>

<div class="price">

${cenaProduktu.toFixed(2)} zł

</div>

${stockHTML}

<div class="quantity-box">

<button onclick="zmniejszIlosc(${index})">

-

</button>

<div class="quantity-number">

${produkt.ilosc}

</div>

<button onclick="zwiekszIlosc(${index})">

+

</button>

</div>

</div>

<button class="remove"
onclick="usunProdukt(${index})">

Usuń

</button>

</div>

`;

});

localStorage.setItem(
"koszyk",
JSON.stringify(koszyk)
);

let dostawa = 14.99;

if(suma >= 50){

dostawa = 0;

document.querySelector(".delivery-info")
.innerHTML =
"🎉 Masz darmową dostawę do Paczkomatu!";

}

document.getElementById("produkty-suma")
.innerText =
suma.toFixed(2) + " zł";

document.getElementById("dostawa")
.innerText =
dostawa.toFixed(2) + " zł";

document.getElementById("suma")
.innerText =
(suma + dostawa).toFixed(2) + " zł";

if(blokada){

document.getElementById("checkout-btn")
.classList.add("checkout-disabled");

}else{

document.getElementById("checkout-btn")
.classList.remove("checkout-disabled");

}

}

function zwiekszIlosc(index){

let koszyk =
JSON.parse(localStorage.getItem("koszyk")) || [];

koszyk[index].ilosc++;

localStorage.setItem(
"koszyk",
JSON.stringify(koszyk)
);

wyswietlKoszyk();

}

function zmniejszIlosc(index){

let koszyk =
JSON.parse(localStorage.getItem("koszyk")) || [];

if(koszyk[index].ilosc > 1){

koszyk[index].ilosc--;

}

localStorage.setItem(
"koszyk",
JSON.stringify(koszyk)
);

wyswietlKoszyk();

}

function usunProdukt(index){

let koszyk =
JSON.parse(localStorage.getItem("koszyk")) || [];

koszyk.splice(index,1);

localStorage.setItem(
"koszyk",
JSON.stringify(koszyk)
);

wyswietlKoszyk();

}

wyswietlKoszyk();

async function stripeCheckout(){

let koszyk =
JSON.parse(localStorage.getItem("koszyk")) || [];

if(koszyk.length === 0){

alert("Koszyk jest pusty");

return;

}

try{

const response = await fetch(
'/api/create-checkout-session',
{
method:'POST',

headers:{
'Content-Type':'application/json'
},

body: JSON.stringify({
items:koszyk
})

});

const text = await response.text();

console.log("ODPOWIEDŹ API:");
console.log(text);

let data;

try{

data = JSON.parse(text);

}catch(e){

alert("API zwróciło błąd:\n\n" + text);

return;

}

if(data.url){

window.location.href = data.url;

}else if(data.error){

alert("Stripe Error:\n\n" + data.error);

}else{

alert("Nieznany błąd Stripe");

}

}catch(err){

console.log(err);

alert("Błąd połączenia");

}

}

</script>
