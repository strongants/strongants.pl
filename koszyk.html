<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Koszyk - Strong Ants</title>

<style>

body{
margin:0;
background:#0d0d0d;
font-family:Arial;
color:white;
}

header{
background:black;
padding:20px;
border-bottom:2px solid #ffd000;
}

.logo{
font-size:32px;
font-weight:bold;
color:#ffd000;
display:flex;
align-items:center;
gap:12px;
text-decoration:none;
}

.section{
padding:60px 10%;
}

.title{
font-size:42px;
color:#ffd000;
margin-bottom:40px;
}

.product{
background:#161616;
border:1px solid #333;
border-radius:20px;
padding:20px;
margin-bottom:20px;
display:flex;
gap:20px;
align-items:center;
}

.product img{
width:120px;
height:120px;
object-fit:contain;
background:white;
border-radius:15px;
padding:10px;
}

.product-info{
flex:1;
}

.product h3{
color:#ffd000;
margin:0 0 10px;
}

.price{
font-size:28px;
font-weight:bold;
color:#ffd000;
margin-top:10px;
}

.remove{
background:red;
border:none;
padding:10px 20px;
border-radius:10px;
color:white;
cursor:pointer;
font-weight:bold;
transition:0.2s;
}

.remove:hover{
transform:scale(1.05);
}

.total{
font-size:36px;
color:#ffd000;
margin-top:40px;
font-weight:bold;
}

.empty{
font-size:24px;
color:#999;
}

.buttons{
display:flex;
gap:20px;
flex-wrap:wrap;
margin-top:30px;
}

.back-button{
display:inline-block;
padding:14px 28px;
background:#ffd000;
color:black;
font-weight:bold;
border-radius:12px;
text-decoration:none;
font-size:20px;
}

.checkout-button{
display:inline-block;
padding:14px 28px;
background:#00c853;
color:white;
font-weight:bold;
border-radius:12px;
text-decoration:none;
font-size:20px;
transition:0.2s;
}

.checkout-button:hover{
transform:scale(1.03);
}

.quantity-box{
display:flex;
align-items:center;
gap:12px;
margin-top:15px;
}

.quantity-box button{
width:36px;
height:36px;
border:none;
border-radius:10px;
background:#ffd000;
color:black;
font-size:24px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

.quantity-box button:hover{
transform:scale(1.08);
}

.quantity-number{
font-size:22px;
font-weight:bold;
min-width:30px;
text-align:center;
}

@media(max-width:900px){

.product{
flex-direction:column;
align-items:flex-start;
}

.product img{
width:100%;
max-width:220px;
height:auto;
}

.title{
font-size:34px;
}

.total{
font-size:30px;
}

}

</style>

</head>

<body>

<header>

<a href="index.html" class="logo">

<img src="logo (2).png"
style="width:55px; height:55px; border-radius:12px;">

<div>
STRONG ANTS
</div>

</a>

</header>

<section class="section">

<h1 class="title">
🛒 Twój koszyk
</h1>

<div id="koszyk"></div>

<div class="total" id="suma">
Suma: 0 zł
</div>

<div class="buttons">

<a href="produkty.html" class="back-button">
← Kontynuuj zakupy
</a>

<a href="checkout.html" class="checkout-button">
🛒 Zamawiam i płacę
</a>

</div>

</section>

<script>

function wyswietlKoszyk(){

let koszyk =
JSON.parse(localStorage.getItem("koszyk")) || [];

let kontener =
document.getElementById("koszyk");

let suma = 0;

if(koszyk.length === 0){

kontener.innerHTML = `
<div class="empty">
Koszyk jest pusty.
</div>
`;

document.getElementById("suma").style.display = "none";

return;
}

kontener.innerHTML = "";

koszyk.forEach((produkt,index)=>{

if(!produkt.ilosc){
produkt.ilosc = 1;
}

let cenaProduktu =
Number(produkt.cena) * produkt.ilosc;

suma += cenaProduktu;

kontener.innerHTML += `

<div class="product">

<img src="${produkt.obraz}"
alt="${produkt.nazwa}"
onerror="this.src='logo (2).png'">

<div class="product-info">

<h3>${produkt.nazwa}</h3>

<div class="price">
${cenaProduktu.toFixed(2)} zł
</div>

<div class="quantity-box">

<button onclick="zmniejszIlosc(${index})">
-
</button>

<div class="quantity-number">
${produkt.ilosc}
</div>

<button onclick="zwiekszIlosc(${index})">
+
</button>

</div>

</div>

<button class="remove"
onclick="usunProdukt(${index})">

Usuń

</button>

</div>

`;

});

localStorage.setItem(
"koszyk",
JSON.stringify(koszyk)
);

document.getElementById("suma").innerText =
"Suma: " + suma.toFixed(2) + " zł";

}

function zwiekszIlosc(index){

let koszyk =
JSON.parse(localStorage.getItem("koszyk")) || [];

koszyk[index].ilosc++;

localStorage.setItem(
"koszyk",
JSON.stringify(koszyk)
);

wyswietlKoszyk();

}

function zmniejszIlosc(index){

let koszyk =
JSON.parse(localStorage.getItem("koszyk")) || [];

if(koszyk[index].ilosc > 1){

koszyk[index].ilosc--;

}

localStorage.setItem(
"koszyk",
JSON.stringify(koszyk)
);

wyswietlKoszyk();

}

function usunProdukt(index){

let koszyk =
JSON.parse(localStorage.getItem("koszyk")) || [];

koszyk.splice(index,1);

localStorage.setItem(
"koszyk",
JSON.stringify(koszyk)
);

wyswietlKoszyk();

}

wyswietlKoszyk();

</script>

</body>
</html>
