<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Koszyk - Strong Ants</title>

<style>

body{
margin:0;
background:#0d0d0d;
font-family:Arial;
color:white;
}

header{
background:black;
padding:20px;
border-bottom:2px solid #ffd000;
}

.logo{
font-size:32px;
font-weight:bold;
color:#ffd000;
}

.section{
padding:60px 10%;
}

.title{
font-size:42px;
color:#ffd000;
margin-bottom:40px;
}

.product{
background:#161616;
border:1px solid #333;
border-radius:20px;
padding:20px;
margin-bottom:20px;
display:flex;
gap:20px;
align-items:center;
}

.product img{
width:120px;
height:120px;
object-fit:contain;
background:white;
border-radius:15px;
}

.product-info{
flex:1;
}

.product h3{
color:#ffd000;
margin:0 0 10px;
}

.price{
font-size:28px;
font-weight:bold;
color:#ffd000;
margin-top:10px;
}

.remove{
background:red;
border:none;
padding:10px 20px;
border-radius:10px;
color:white;
cursor:pointer;
font-weight:bold;
}

.total{
font-size:36px;
color:#ffd000;
margin-top:40px;
font-weight:bold;
}

.empty{
font-size:24px;
color:#999;
}

</style>

</head>

<body>

<header>
<div class="logo">
🐜 STRONG ANTS
</div>
</header>

<section class="section">

<h1 class="title">
🛒 Twój koszyk
</h1>

<div id="koszyk"></div>

<div class="total" id="suma">
Suma: 0 zł
</div>

</section>

<script>

function wyswietlKoszyk(){

let koszyk = JSON.parse(localStorage.getItem("koszyk")) || [];

let kontener = document.getElementById("koszyk");

let suma = 0;

if(koszyk.length === 0){

kontener.innerHTML = `
<div class="empty">
Koszyk jest pusty.
</div>
`;

document.getElementById("suma").style.display = "none";

return;
}

kontener.innerHTML = "";

koszyk.forEach((produkt,index)=>{

suma += produkt.cena;

kontener.innerHTML += `

<div class="product">

<img src="${produkt.zdjecie}">

<div class="product-info">

<h3>${produkt.nazwa}</h3>

<div class="price">
${produkt.cena} zł
</div>

</div>

<button class="remove"
onclick="usunProdukt(${index})">
Usuń
</button>

</div>

`;

});

document.getElementById("suma").innerText =
"Suma: " + suma.toFixed(2) + " zł";

}

function usunProdukt(index){

let koszyk = JSON.parse(localStorage.getItem("koszyk")) || [];

koszyk.splice(index,1);

localStorage.setItem("koszyk", JSON.stringify(koszyk));

wyswietlKoszyk();

}

wyswietlKoszyk();

</script>

</body>
</html>
