<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pęseta do hodowli mrówek - Strong Ants</title>

<style>

body{
margin:0;
background:#0d0d0d;
font-family:Arial;
color:white;
}

.container{
max-width:1200px;
margin:auto;
padding:60px 20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:50px;
align-items:start;
}

.image img{
width:100%;
border-radius:20px;
background:white;
}

.title{
font-size:48px;
color:#ffd000;
margin-bottom:20px;
}

.desc{
font-size:22px;
line-height:1.7;
color:#ddd;
margin-bottom:30px;
}

.select-title{
font-size:24px;
margin-bottom:15px;
}

select{
width:100%;
padding:15px;
font-size:20px;
border-radius:12px;
border:none;
background:#1b1b1b;
color:white;
margin-bottom:30px;
}

.price{
font-size:42px;
font-weight:bold;
color:#ffd000;
margin-bottom:30px;
}

.button{
display:inline-block;
padding:18px 35px;
background:#ffd000;
color:black;
font-size:22px;
font-weight:bold;
border-radius:14px;
text-decoration:none;
}

.features{
margin-top:30px;
line-height:2;
font-size:20px;
color:#ddd;
}

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

.title{
font-size:38px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="image">

<img src="zdjecie-podglad-peseta.jpg" alt="Pęseta">

</div>

<div>

<h1 class="title">
🛠 Pęseta do hodowli mrówek
</h1>

<p class="desc">
Profesjonalna pęseta ze stali nierdzewnej do prac przy formikarium.
Idealna do karmienia, sprzątania oraz przenoszenia elementów dekoracji.
</p>

<div class="select-title">
Wybierz długość:
</div>

<select id="sizeSelect" onchange="changePrice()">

<option value="9.99">
13 cm
</option>

<option value="14.99">
18 cm
</option>

<option value="19.99">
25 cm
</option>

</select>

<div class="price" id="price">
9,99 zł
</div>

<button class="button"

onclick="dodajDoKoszyka(
'Pęseta do hodowli mrówek ' + document.getElementById('rozmiar').value,
parseFloat(document.getElementById('cena').innerText.replace(' zł','').replace(',','.')),
'zdjecie-podglad-peseta.jpg'
)">

🛒 Dodaj do koszyka

</button>

<div class="features">

✔ stal nierdzewna<br>
✔ precyzyjna końcówka<br>
✔ wygodna w użyciu<br>
✔ idealna do formikariów

</div>

</div>

</div>

<script>

function changePrice(){

let select = document.getElementById("sizeSelect");
let price = document.getElementById("price");

price.innerHTML = select.value.replace(".", ",") + " zł";

}

</script>

</body>
</html>
