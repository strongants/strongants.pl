<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout - Strong Ants</title>

<style>

body{
margin:0;
background:#0d0d0d;
font-family:Arial;
color:white;
}

.container{
max-width:1200px;
margin:auto;
padding:50px 20px;
}

.title{
font-size:56px;
color:#ffd000;
margin-bottom:40px;
}

.checkout{
display:grid;
grid-template-columns:2fr 1fr;
gap:30px;
}

.box{
background:#161616;
border:1px solid #333;
border-radius:25px;
padding:35px;
margin-bottom:25px;
}

.box h2{
color:#ffd000;
margin-top:0;
font-size:34px;
}

input, select{
width:100%;
padding:18px;
margin-top:15px;
background:#0f0f0f;
border:1px solid #333;
border-radius:14px;
color:white;
font-size:17px;
box-sizing:border-box;
}

.summary{
background:#161616;
border:1px solid #333;
border-radius:25px;
padding:35px;
height:fit-content;
position:sticky;
top:20px;
}

.summary h2{
font-size:38px;
color:#ffd000;
margin-top:0;
}

.row{
display:flex;
justify-content:space-between;
margin-bottom:20px;
font-size:22px;
}

.product-row{
display:flex;
justify-content:space-between;
margin-bottom:12px;
font-size:18px;
color:#ddd;
gap:15px;
}

.total{
font-size:48px;
font-weight:bold;
margin:40px 0;
color:#ffd000;
}

.pay-btn{
display:block;
width:100%;
padding:22px;
background:#ffd000;
border:none;
border-radius:16px;
font-size:24px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

.pay-btn:hover{
transform:scale(1.02);
}

.secure{
margin-top:20px;
color:#999;
font-size:16px;
text-align:center;
}

.back{
display:inline-block;
margin-top:30px;
padding:14px 28px;
background:#ffd000;
color:black;
font-weight:bold;
border-radius:12px;
text-decoration:none;
}

@media(max-width:900px){

.checkout{
grid-template-columns:1fr;
}

.title{
font-size:42px;
}

.total{
font-size:38px;
}

}

</style>

</head>

<body>

<div class="container">

<h1 class="title">
💳 Finalizacja zamówienia
</h1>

<div class="checkout">

<div class="left">

<div class="box">

<h2>
Dane klienta
</h2>

<input type="text" id="name" placeholder="Imię i nazwisko">

<input type="email" id="email" placeholder="Adres e-mail">

<input type="text" id="phone" placeholder="Numer telefonu">

<input type="text" id="address" placeholder="Adres dostawy">

</div>

<div class="box">

<h2>
Dostawa
</h2>

<select id="delivery" onchange="przeliczSume()">

<option value="14.99">
InPost Paczkomat — 14,99 zł
</option>

<option value="16.99">
Kurier InPost — 16,99 zł
</option>

<option value="12.99">
Orlen Paczka — 12,99 zł
</option>

</select>

</div>

<div class="box">

<h2>
Płatność
</h2>

<select>

<option>BLIK</option>

<option>Karta płatnicza</option>

<option>Google Pay</option>

<option>Apple Pay</option>

<option>Przelew online</option>

</select>

</div>

<a href="koszyk.html" class="back">
← Powrót do koszyka
</a>

</div>

<div class="summary">

<h2>
Podsumowanie
</h2>

<div id="produkty-checkout"></div>

<hr style="border:1px solid #333; margin:25px 0;">

<div class="row">
<span>Produkty</span>
<span id="produkty-suma">0 zł</span>
</div>

<div class="row">
<span>Dostawa</span>
<span id="dostawa-suma">14,99 zł</span>
</div>

<div class="total" id="total">
0 zł
</div>

<button class="pay-btn" onclick="payNow()">
🛒 Zamawiam i płacę
</button>

<div class="secure">
🔒 Bezpieczne płatności Strong Ants
</div>

</div>

</div>

</div>

<script>

let sumaProduktow = 0;

function zaladujKoszyk(){

let koszyk =
JSON.parse(localStorage.getItem("koszyk")) || [];

let kontener =
document.getElementById("produkty-checkout");

kontener.innerHTML = "";

sumaProduktow = 0;

koszyk.forEach((produkt)=>{

let cena = Number(produkt.cena);

let ilosc = produkt.ilosc || 1;

let razem = cena * ilosc;

sumaProduktow += razem;

kontener.innerHTML += `

<div class="product-row">

<div>
${produkt.nazwa}
x${ilosc}
</div>

<div>
${razem.toFixed(2)} zł
</div>

</div>

`;

});

document.getElementById("produkty-suma").innerText =
sumaProduktow.toFixed(2) + " zł";

przeliczSume();

}

function przeliczSume(){

let dostawa =
Number(document.getElementById("delivery").value);

document.getElementById("dostawa-suma").innerText =
dostawa.toFixed(2) + " zł";

let suma =
sumaProduktow + dostawa;

document.getElementById("total").innerText =
suma.toFixed(2) + " zł";

}

function payNow(){

let name =
document.getElementById("name").value;

let email =
document.getElementById("email").value;

let phone =
document.getElementById("phone").value;

let address =
document.getElementById("address").value;

if(name === "" ||
email === "" ||
phone === "" ||
address === ""){

alert("Uzupełnij wszystkie dane.");

return;

}

alert(
"Dziękujemy za zamówienie w Strong Ants 🐜"
);

localStorage.removeItem("koszyk");

window.location.href =
"dziekujemy.html";

}

zaladujKoszyk();

</script>

</body>
</html>
