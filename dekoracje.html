<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dekoracje - Strong Ants</title>

<style>

body{
margin:0;
background:#0d0d0d;
font-family:Arial;
color:white;
}

header{
background:black;
padding:20px;
border-bottom:2px solid #ffd000;
}

.logo{
font-size:32px;
font-weight:bold;
color:#ffd000;
display:flex;
align-items:center;
gap:12px;
}

.section{
padding:60px 10%;
}

.title{
font-size:42px;
color:#ffd000;
margin-bottom:40px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;
}

.card{
background:#161616;
padding:25px;
border-radius:20px;
border:1px solid #333;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
border-color:#ffd000;
}

.card img{
width:100%;
height:220px;
object-fit:contain;
background:white;
border-radius:15px;
margin-bottom:20px;
padding:10px;
box-sizing:border-box;
}

.card h3{
color:#ffd000;
font-size:30px;
margin-bottom:15px;
}

.card p{
line-height:1.7;
color:#ddd;
font-size:18px;
}

.price{
font-size:32px;
color:#ffd000;
font-weight:bold;
margin-top:20px;
margin-bottom:15px;
}

.button{
display:inline-block;
margin-top:15px;
padding:12px 24px;
background:#ffd000;
color:black;
text-decoration:none;
font-weight:bold;
border-radius:10px;
}

.button:hover{
opacity:0.9;
}

@media(max-width:768px){

.section{
padding:40px 20px;
}

.title{
font-size:34px;
}

}

</style>

</head>

<body>

<header>

<div class="logo">

🐜 STRONG ANTS

</div>

</header>

<section class="section">

<h1 class="title">
 Dekoracje do formikarium
</h1>

<div class="products">




<div class="card">

<img src="piasek-czarny.jpg" alt="Piasek czarny">

<h3>
 Piasek czarny
</h3>

<div class="price">
3,99 zł
</div>

<a class="button" href="piasek-czarny.html">
Zobacz ofertę
</a>

</div>


<div class="card">

<img src="piasek-kwarcowy-bialy.jpg" alt="Piasek kwarcowy biały">

<h3>
 Piasek kwarcowy biały
</h3>

<div class="price">
3,99 zł
</div>

<a class="button" href="piasek-kwarcowy-bialy.html">
Zobacz ofertę
</a>

</div>





<div class="card">

<img src="kamienie-dekoracyjne.jpg" alt="Kamienie dekoracyjne">

<h3>  Kamienie dekoracyjne
</h3>

<div class="price">
3,99 zł
</div>

<a class="button" href="kamienie-dekoracyjne.html">
Zobacz ofertę
</a>

</div>

</div>

</section>

</body>

</html>
